<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
  <defs>
    <!-- Dusk Sky Gradient -->
    <linearGradient id="vaporSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a051b" />
      <stop offset="35%" stop-color="#210b42" />
      <stop offset="60%" stop-color="#54125e" />
      <stop offset="78%" stop-color="#911d68" />
      <stop offset="90%" stop-color="#d63f53" />
      <stop offset="100%" stop-color="#f89038" />
    </linearGradient>

    <!-- Retro Segmented Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeb3b" />
      <stop offset="40%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#e01a88" />
    </linearGradient>

    <!-- Sun Glow Outer -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 123, 0, 0.45)" />
      <stop offset="50%" stop-color="rgba(224, 26, 136, 0.2)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- Grid Floor Gradient -->
    <linearGradient id="gridSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140624" />
      <stop offset="100%" stop-color="#08020e" />
    </linearGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="3840" height="1500" fill="url(#vaporSky)" />

  <!-- Stars & Constellations in Upper Sky -->
  <g fill="#ffebfb" opacity="0.75">
    <circle cx="280" cy="140" r="2.5" />
    <circle cx="620" cy="280" r="1.5" />
    <circle cx="940" cy="110" r="3" />
    <circle cx="1320" cy="220" r="2" />
    <circle cx="1740" cy="130" r="2.5" />
    <circle cx="2180" cy="240" r="1.5" />
    <circle cx="2640" cy="160" r="2" />
    <circle cx="3080" cy="290" r="3" />
    <circle cx="3520" cy="180" r="2" />
    <circle cx="480" cy="460" r="1.8" />
    <circle cx="3340" cy="420" r="2.2" />
  </g>

  <!-- Retro Sun Glow -->
  <circle cx="1920" cy="1200" r="700" fill="url(#sunGlow)" />

  <!-- Retro Segmented Sun (Masking slices) -->
  <g>
    <!-- Slice 1 (Top full cap) -->
    <path d="M1520,1200 A400,400 0 0,1 2320,1200 L2320,1050 A400,400 0 0,0 1520,1050 Z" fill="url(#sunGrad)" />
    <!-- Slice 2 -->
    <rect x="1530" y="1068" width="780" height="34" fill="url(#sunGrad)" />
    <!-- Slice 3 -->
    <rect x="1548" y="1116" width="744" height="28" fill="url(#sunGrad)" />
    <!-- Slice 4 -->
    <rect x="1576" y="1156" width="688" height="22" fill="url(#sunGrad)" />
    <!-- Slice 5 -->
    <rect x="1616" y="1190" width="608" height="16" fill="url(#sunGrad)" />
    <!-- Slice 6 -->
    <rect x="1670" y="1216" width="500" height="12" fill="url(#sunGrad)" />
    <!-- Slice 7 -->
    <rect x="1740" y="1236" width="360" height="8" fill="url(#sunGrad)" />
  </g>

  <!-- Distant Mountain Silhouettes -->
  <polygon points="0,1400 350,1180 720,1360 1250,1120 1620,1280 1920,1160 2220,1290 2700,1090 3200,1340 3550,1200 3840,1380 3840,1500 0,1500" fill="#1b082e" />
  <polygon points="0,1460 480,1320 950,1440 1480,1270 1920,1360 2380,1260 2950,1420 3420,1310 3840,1440 3840,1500 0,1500" fill="#12041f" />

  <!-- Grid Perspective Floor -->
  <rect y="1480" width="3840" height="680" fill="url(#gridSurface)" />

  <!-- Glowing Horizon Line -->
  <line x1="0" y1="1480" x2="3840" y2="1480" stroke="#ff7b00" stroke-width="4" opacity="0.8" />
  <line x1="0" y1="1480" x2="3840" y2="1480" stroke="#ff007f" stroke-width="12" opacity="0.4" />

  <!-- Perspective Floor Grid Lines (Radiating from Horizon Center) -->
  <g stroke="#e01a88" stroke-width="2.5" opacity="0.55">
    <line x1="1920" y1="1480" x2="-600" y2="2160" />
    <line x1="1920" y1="1480" x2="-100" y2="2160" />
    <line x1="1920" y1="1480" x2="400" y2="2160" />
    <line x1="1920" y1="1480" x2="900" y2="2160" />
    <line x1="1920" y1="1480" x2="1350" y2="2160" />
    <line x1="1920" y1="1480" x2="1700" y2="2160" />
    <line x1="1920" y1="1480" x2="1920" y2="2160" />
    <line x1="1920" y1="1480" x2="2140" y2="2160" />
    <line x1="1920" y1="1480" x2="2490" y2="2160" />
    <line x1="1920" y1="1480" x2="2940" y2="2160" />
    <line x1="1920" y1="1480" x2="3440" y2="2160" />
    <line x1="1920" y1="1480" x2="3940" y2="2160" />
    <line x1="1920" y1="1480" x2="4440" y2="2160" />
  </g>

  <!-- Horizontal Grid Lines with Geometric Perspective Spacing -->
  <g stroke="#ff0080" stroke-width="2" opacity="0.6">
    <line x1="0" y1="1500" x2="3840" y2="1500" stroke-width="1" />
    <line x1="0" y1="1525" x2="3840" y2="1525" stroke-width="1.2" />
    <line x1="0" y1="1558" x2="3840" y2="1558" stroke-width="1.5" />
    <line x1="0" y1="1602" x2="3840" y2="1602" stroke-width="1.8" />
    <line x1="0" y1="1660" x2="3840" y2="1660" stroke-width="2.2" />
    <line x1="0" y1="1736" x2="3840" y2="1736" stroke-width="2.6" />
    <line x1="0" y1="1836" x2="3840" y2="1836" stroke-width="3" />
    <line x1="0" y1="1968" x2="3840" y2="1968" stroke-width="3.5" />
    <line x1="0" y1="2140" x2="3840" y2="2140" stroke-width="4" />
  </g>

  <!-- Silhouettes of Palm Trees along Edges -->
  <g fill="#08020e">
    <!-- Left Palm Trunk & Fronds -->
    <path d="M420,2160 Q450,1780 390,1420 L410,1420 Q475,1780 445,2160 Z" />
    <path d="M395,1420 Q310,1360 210,1390 Q300,1395 395,1420 Z" />
    <path d="M395,1420 Q330,1310 260,1290 Q340,1335 395,1420 Z" />
    <path d="M395,1420 Q400,1280 430,1220 Q415,1300 395,1420 Z" />
    <path d="M395,1420 Q480,1320 560,1320 Q480,1355 395,1420 Z" />
    <path d="M395,1420 Q500,1390 600,1430 Q495,1415 395,1420 Z" />

    <!-- Right Palm Trunk & Fronds -->
    <path d="M3440,2160 Q3410,1750 3470,1390 L3490,1390 Q3435,1750 3465,2160 Z" />
    <path d="M3480,1390 Q3560,1330 3670,1350 Q3570,1360 3480,1390 Z" />
    <path d="M3480,1390 Q3540,1270 3610,1250 Q3540,1305 3480,1390 Z" />
    <path d="M3480,1390 Q3470,1240 3430,1190 Q3460,1270 3480,1390 Z" />
    <path d="M3480,1390 Q3390,1290 3300,1300 Q3390,1330 3480,1390 Z" />
    <path d="M3480,1390 Q3370,1360 3270,1410 Q3380,1390 3480,1390 Z" />
  </g>
</svg>
